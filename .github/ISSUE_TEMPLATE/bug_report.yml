name: Bug report
description: Report a reproducible problem with Swift-Mermaid.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal Mermaid source and Swift code, without confidential data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Package version, Xcode and Swift versions, OS version and device or simulator.
    validations:
      required: true
